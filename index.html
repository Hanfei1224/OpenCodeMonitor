<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>OpencodeMonitor</title>
<style>
  :root {
    --accent:#5b9bff; --warn:#f5a623; --danger:#ff5f57;
    --text:#e8ecf4; --muted:#8a93a6; --chip-on:#9fd6a8;
    --bg-r:30; --bg-g:35; --bg-b:48;
    --bg-tr:54; --bg-tg:59; --bg-tb:72;
    --bg-o:1;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),var(--bg-o));
    overflow:hidden; width:100%; height:100%;
  }
  body {
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--text); user-select:none; -webkit-user-select:none;
  }
  #card {
    width:100%; height:100%; display:flex; flex-direction:column;
    background:linear-gradient(165deg,
      rgba(var(--bg-tr),var(--bg-tg),var(--bg-tb),var(--bg-o)),
      rgba(var(--bg-r),var(--bg-g),var(--bg-b),var(--bg-o)));
    border:1px solid rgba(255,255,255,calc(var(--bg-o) * 0.09));
    box-shadow:0 8px 28px rgba(0,0,0,calc(var(--bg-o) * 0.45));
    position:relative;
  }
  .header { display:flex; align-items:center; gap:8px; padding:11px 12px 8px; flex:none; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--accent);
         box-shadow:0 0 8px var(--accent); flex:none; }
  .dot.off { background:var(--danger); box-shadow:0 0 8px var(--danger); }
  .plan { font-weight:600; font-size:14px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chips { margin-left:auto; display:flex; gap:5px; flex:none; align-items:center; }
  .chip { font-size:10px; color:var(--muted); border:1px solid rgba(255,255,255,.13);
          border-radius:99px; padding:2px 5px; display:inline-flex; align-items:center;
          justify-content:center; }
  .chip.on { color:var(--chip-on); border-color:rgba(130,220,150,.4); }
  .icon-btn { width:20px; height:20px; border-radius:6px; border:none; background:transparent;
              color:var(--muted); font-size:12px; line-height:1; cursor:pointer; display:flex;
              align-items:center; justify-content:center; }
  .icon-btn:hover { background:rgba(255,255,255,.13); color:#fff; }
  #close { margin-left:2px; width:20px; height:20px; border-radius:6px; border:none;
           background:transparent; color:var(--muted); font-size:12px; line-height:1; cursor:pointer; }
  #close:hover { background:rgba(255,255,255,.13); color:#fff; }

  .rings { flex:1; display:flex; justify-content:space-around; align-items:center;
           padding:0 4px 6px; min-height:0; }
  .ring { width:108px; text-align:center; }
  .ring-svg { position:relative; width:108px; height:108px; margin:0 auto; }
  .ring-svg svg { width:108px; height:108px; transform:rotate(-90deg); }
  .ring-track { fill:none; stroke:rgba(255,255,255,.07); stroke-width:9; }
  .ring-bar { fill:none; stroke:var(--accent); stroke-width:9; stroke-linecap:round;
              stroke-dasharray:326.73; stroke-dashoffset:326.73;
              transition:stroke-dashoffset .9s ease, stroke .3s; }
  .ring-bar.warn { stroke:var(--warn); }
  .ring-bar.danger { stroke:var(--danger); }
  .ring-center { position:absolute; inset:0; display:flex; align-items:center;
                 justify-content:center; pointer-events:none; gap:2px; }
  .pct { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .pct-sym { font-size:13px; margin-top:5px; color:var(--muted); }
  .ring-label { font-size:13px; font-weight:600; margin:2px auto 0; width:fit-content; }
  .ring-reset { font-size:11px; color:var(--text); margin:5px auto 0; width:fit-content;
                font-variant-numeric:tabular-nums; }
  .ring-used { font-size:11px; color:var(--text); margin:5px auto 0;
               font-variant-numeric:tabular-nums; white-space:nowrap; width:fit-content; }

  .footer { display:flex; align-items:center; justify-content:space-between;
            padding:7px 14px 12px; font-size:12px; color:var(--text); flex:none; }
  .footer .err { color:var(--danger); max-width:60%; overflow:hidden; text-overflow:ellipsis;
                 white-space:nowrap; }
  .footer-right { display:flex; align-items:center; gap:8px; min-width:0; }
  #latency { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .disc { width:68px; height:68px; display:flex; align-items:center; justify-content:center;
          gap:2px; border-radius:50%; }

  /* 低透明度(<60%)时给文字控件垫底色：半透明深色(55%)，可读且不完全遮死下层内容 */
  body.low-opacity .plan,
  body.low-opacity .ring-label,
  body.low-opacity .ring-reset,
  body.low-opacity .ring-used,
  body.low-opacity .footer > span {
    background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),.55);
    border:1px solid rgba(255,255,255,.08);
    border-radius:99px;
    padding:1px 7px;
  }
  body.low-opacity .chip,
  body.low-opacity .icon-btn { background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),.55); }
  body.low-opacity .disc { background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),.55); }

  #overlay { position:fixed; inset:1px; border-radius:14px; z-index:5; display:none;
             align-items:center; justify-content:center; text-align:center; padding:26px;
             background:linear-gradient(165deg,
               rgba(var(--bg-tr),var(--bg-tg),var(--bg-tb),.98),
               rgba(var(--bg-r),var(--bg-g),var(--bg-b),.98));
             border:1px solid rgba(255,255,255,.09); }
  #overlay b { display:block; font-size:15px; margin-bottom:10px; }
  #overlay .sub { font-size:12px; color:var(--muted); }
  #overlay input[type=text] {
    width:100%; margin-top:12px; padding:9px 11px; border-radius:8px;
    border:1px solid rgba(255,255,255,.18); background:rgba(0,0,0,.28);
    color:var(--text); font-size:12px; outline:none; font-family:inherit;
    box-sizing:border-box;
  }
  #overlay input[type=text]:focus { border-color:var(--accent); }
  #overlay button {
    margin-top:12px; padding:8px 0; width:100%; border:none; border-radius:8px;
    background:var(--accent); color:#0c0e14; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  #overlay button:hover { filter:brightness(1.12); }

  #settings-menu { position:absolute; top:42px; left:8px; width:214px; z-index:6;
                   display:none; flex-direction:column; gap:10px; padding:12px 12px 13px;
                   border-radius:12px;
                   background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),.96);
                   border:1px solid rgba(255,255,255,.12);
                   box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .srow { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text); }
  .srow label { flex:none; width:48px; }
  .srow input[type=range] { flex:1; accent-color:var(--accent); height:16px; }
  .srow .val { flex:none; width:38px; text-align:right; font-size:11px; color:var(--muted);
               font-variant-numeric:tabular-nums; }
  .srow input[type=color] { flex:none; width:30px; height:22px; padding:0; border:1px solid rgba(255,255,255,.2);
                            border-radius:5px; background:transparent; cursor:pointer; }
  .srow input[type=color]::-webkit-color-swatch-wrapper { padding:1px; }
  .srow input[type=color]::-webkit-color-swatch { border:none; border-radius:4px; }
</style>
</head>
<body>
  <div id="card">
    <div class="header">
      <span class="dot" id="dot"></span>
      <span class="plan" id="plan">OpenCode Go 1.0.0</span>
      <div class="chips">
        <button class="icon-btn" id="gear" title="设置">⚙</button>
        <span class="chip" id="chip-top" title="置顶"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></span>
        <span class="chip" id="chip-thru" title="鼠标穿透"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M13 9h4.5c.28 0 .5-.22.5-.5V6c0-2.76-2.24-5-5-5s-5 2.24-5 5v2.5c0 .28.22.5.5.5H13zM13 4c1.1 0 2 .9 2 2h-4V6c0-1.1.9-2 2-2zm6 7c-.55 0-1 .45-1 1v1c0 4.42-3.58 8-8 8s-8-3.58-8-8v-1c0-.55-.45-1-1-1s-1 .45-1 1v1c0 5.52 4.48 10 10 10s10-4.48 10-10v-1c0-.55-.45-1-1-1z"/></svg></span>
      </div>
      <button id="close" title="最小化到托盘">✕</button>
    </div>

    <div class="rings">
      <div class="ring">
        <div class="ring-svg">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-bar" id="bar-rolling" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center"><span class="disc"><span class="pct" id="pct-rolling">–</span><span class="pct-sym">%</span></span></div>
        </div>
        <div class="ring-label">5小时</div>
        <div class="ring-reset" id="reset-rolling">–</div>
        <div class="ring-used" id="used-rolling">–</div>
      </div>

      <div class="ring">
        <div class="ring-svg">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-bar" id="bar-weekly" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center"><span class="disc"><span class="pct" id="pct-weekly">–</span><span class="pct-sym">%</span></span></div>
        </div>
        <div class="ring-label">本周</div>
        <div class="ring-reset" id="reset-weekly">–</div>
        <div class="ring-used" id="used-weekly">–</div>
      </div>

      <div class="ring">
        <div class="ring-svg">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle class="ring-bar" id="bar-monthly" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center"><span class="disc"><span class="pct" id="pct-monthly">–</span><span class="pct-sym">%</span></span></div>
        </div>
        <div class="ring-label">本月</div>
        <div class="ring-reset" id="reset-monthly">–</div>
        <div class="ring-used" id="used-monthly">–</div>
      </div>
    </div>

    <div class="footer">
      <span>上次刷新 <span id="last">–</span></span>
      <span class="footer-right">
        <span id="latency">–</span>
        <span class="err" id="err"></span>
      </span>
    </div>

    <div id="settings-menu">
      <div class="srow"><label>透明度</label>
        <input type="range" id="s-opacity" min="0" max="100" value="100">
        <span class="val" id="s-opacity-val">100%</span></div>
      <div class="srow"><label>背景颜色</label><input type="color" id="s-bg" value="#1e2330"></div>
      <div class="srow"><label>强调色</label><input type="color" id="s-accent" value="#5b9bff"></div>
    </div>
  </div>

  <div id="overlay">
    <div>
      <b id="overlay-title">请配置 API Key</b>
      <span class="sub">填入 opencode.ai 的 API Key，保存后自动连接：</span>
      <input type="text" id="api-key-input" placeholder="sk-xxxxxxxx" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="api-key-save">保存并连接</button>
    </div>
  </div>

<script>
  const CIRC = 326.73;
  const KEYS = ['rolling', 'weekly', 'monthly'];
  const MODES = { rolling: 'minute', weekly: 'hour', monthly: 'hour' };
  // 官方美元配额（opencode.ai/docs/go）：5小时=$12、每周=$30、每月=$60
  const LIMITS = { rolling: 12, weekly: 30, monthly: 60 };
  const VERSION = '1.1.2';
  let settingsApplied = false;
  let currentAccent = '#5b9bff';
  let thruBeforeOverlay = null;  // 配置面板显示前的穿透状态，保存后恢复

  function applyAccent(color) {
    document.documentElement.style.setProperty('--accent', color);
  }

  function hex2rgb(h) {
    h = String(h).replace('#', '');
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }

  function applySettings(s) {
    const [r, g, b] = hex2rgb(s.bg_color);
    const top = [Math.min(255, r + 24), Math.min(255, g + 24), Math.min(255, b + 24)];
    const el = document.documentElement.style;
    el.setProperty('--bg-r', r); el.setProperty('--bg-g', g); el.setProperty('--bg-b', b);
    el.setProperty('--bg-tr', top[0]); el.setProperty('--bg-tg', top[1]); el.setProperty('--bg-tb', top[2]);
    el.setProperty('--bg-o', s.bg_opacity);
    currentAccent = s.accent_color;
    applyAccent(currentAccent);
    document.getElementById('s-bg').value = s.bg_color;
    document.getElementById('s-accent').value = s.accent_color;
    document.getElementById('s-opacity').value = Math.round(s.bg_opacity * 100);
    document.getElementById('s-opacity-val').textContent = Math.round(s.bg_opacity * 100) + '%';
    document.body.classList.toggle('low-opacity', (s.bg_opacity || 0) < 0.6);
  }

  function setRing(key, pct) {
    const p = Math.max(0, Math.min(100, pct));
    const bar = document.getElementById('bar-' + key);
    bar.style.strokeDashoffset = CIRC * (1 - p / 100);
    bar.classList.toggle('warn', p >= 70);
    bar.classList.toggle('danger', p >= 90);
    document.getElementById('pct-' + key).textContent = p;
  }

  function fmtReset(iso, mode) {
    const ms = new Date(iso).getTime() - Date.now();
    if (!isFinite(ms)) return '–';
    if (ms <= 0) return '即将重置';
    const totalMin = Math.round(ms / 60000);
    if (mode === 'minute') {
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (h === 0) return m + '分钟后重置';
      if (m === 0) return h + '小时后重置';
      return h + '小时' + m + '分后重置';
    }
    const totalH = Math.round(totalMin / 60);
    const d = Math.floor(totalH / 24);
    const h = totalH % 24;
    if (d === 0) return h + '小时后重置';
    if (h === 0) return d + '天后重置';
    return d + '天' + h + '小时后重置';
  }

  // 已用美元 = 百分比 × 官方配额上限（接口只给 0-100 整数百分比）
  function fmtUsed(key, w) {
    if (!w || typeof w.percent !== 'number') return '–';
    const lim = LIMITS[key];
    return '已用 $' + (w.percent / 100 * lim).toFixed(2) + ' / $' + lim;
  }

  function setChip(id, on) {
    document.getElementById('chip-' + id).classList.toggle('on', !!on);
  }

  function setDot(ok) {
    document.getElementById('dot').classList.toggle('off', !ok);
  }

  window.applyState = function (s) {
    setChip('top', s.topmost);
    setChip('thru', s.click_through);
  };

  async function tick() {
    let s;
    try { s = await pywebview.api.get_status(); }
    catch (e) { return; }

    if (!settingsApplied && s.settings) { applySettings(s.settings); settingsApplied = true; }

    document.getElementById('plan').textContent = (s.plan_name || 'OpenCode Go') + ' ' + VERSION;
    setChip('top', s.topmost);
    setChip('thru', s.click_through);

    const overlay = document.getElementById('overlay');
    // API Key 未配置或无效时显示填写面板（红色警示主题）；其余错误仅在下栏提示
    const err = s.error || '';
    const needKey = err === 'config_missing' || err.indexOf('API Key') !== -1;
    if (needKey) {
      overlay.style.display = 'flex';
      document.getElementById('overlay-title').textContent =
        err === 'config_missing' ? '请配置 API Key' : 'API Key 无效，请重新填写';
      applyAccent('#ff5f57');
      setDot(false);
      // 穿透开着时输入框点不到：临时关闭，保存后恢复
      if (thruBeforeOverlay === null) {
        thruBeforeOverlay = s.click_through;
        pywebview.api.set_click_through(false);
      }
      return;
    }
    overlay.style.display = 'none';

    const connected = !s.error && !!s.usage;
    // 未连接时主题色变警示红，已连接恢复自定义强调色
    applyAccent(connected ? currentAccent : '#ff5f57');
    setDot(connected);

    const u = s.usage || {};
    for (const k of KEYS) {
      const w = u[k];
      setRing(k, w && typeof w.percent === 'number' ? w.percent : 0);
      document.getElementById('reset-' + k).textContent = w && w.resetsAt ? fmtReset(w.resetsAt, MODES[k]) : '–';
      document.getElementById('used-' + k).textContent = fmtUsed(k, w);
    }

    document.getElementById('last').textContent = s.last_refresh || '–';
    const lat = s.latency_ms;
    document.getElementById('latency').textContent =
      (typeof lat === 'number' && lat >= 0) ? ('响应 ' + lat + ' ms') : '响应 –';
    document.getElementById('err').textContent = s.error ? ('获取失败：' + s.error) : '';
  }

  function saveSettings() {
    pywebview.api.save_settings({
      bg_opacity: parseFloat(document.getElementById('s-opacity').value) / 100,
      bg_color: document.getElementById('s-bg').value,
      accent_color: document.getElementById('s-accent').value,
    });
  }

  document.getElementById('gear').addEventListener('click', function (e) {
    const m = document.getElementById('settings-menu');
    m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    e.stopPropagation();
  });

  document.getElementById('s-opacity').addEventListener('input', function () {
    const v = Math.round(this.value);
    document.getElementById('s-opacity-val').textContent = v + '%';
    document.documentElement.style.setProperty('--bg-o', v / 100);
    document.body.classList.toggle('low-opacity', v / 100 < 0.6);
  });
  document.getElementById('s-opacity').addEventListener('change', saveSettings);

  document.getElementById('s-bg').addEventListener('input', function () {
    const [r, g, b] = hex2rgb(this.value);
    const top = [Math.min(255, r + 24), Math.min(255, g + 24), Math.min(255, b + 24)];
    const el = document.documentElement.style;
    el.setProperty('--bg-r', r); el.setProperty('--bg-g', g); el.setProperty('--bg-b', b);
    el.setProperty('--bg-tr', top[0]); el.setProperty('--bg-tg', top[1]); el.setProperty('--bg-tb', top[2]);
  });
  document.getElementById('s-bg').addEventListener('change', saveSettings);

  document.getElementById('s-accent').addEventListener('input', function () {
    currentAccent = this.value;
    applyAccent(this.value);
    // 已连接时圆点跟随强调色
    if (!document.getElementById('dot').classList.contains('off')) {
      document.getElementById('dot').style.background = this.value;
    }
  });
  document.getElementById('s-accent').addEventListener('change', saveSettings);

  document.getElementById('api-key-save').addEventListener('click', async function () {
    const v = document.getElementById('api-key-input').value.trim();
    if (!v) return;
    this.disabled = true;
    this.textContent = '连接中…';
    try { await pywebview.api.save_api_key(v); }
    catch (e) {}
    // 等待 fetch_loop 完成首次拉取（后台线程），期间 error 仍是旧的 config_missing，
    // 若立即隐藏会因 tick 读到旧状态而“弹回”。轮询到状态更新为止。
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 500));
      let st;
      try { st = await pywebview.api.get_status(); }
      catch (e) { break; }
      if (st && st.error !== 'config_missing') break;
    }
    // 恢复面板前的穿透状态
    if (thruBeforeOverlay !== null) {
      pywebview.api.set_click_through(!!thruBeforeOverlay);
      thruBeforeOverlay = null;
    }
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('api-key-input').value = '';
    this.disabled = false;
    this.textContent = '保存并连接';
  });
  document.getElementById('api-key-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('api-key-save').click();
  });

  document.getElementById('close').addEventListener('click', () => pywebview.api.hide_to_tray());

  // 拖拽窗口：按下卡片任意非交互区域启动，Python 端按物理像素移动（免 DPI 换算）
  let dragging = false;
  document.getElementById('card').addEventListener('mousedown', function (e) {
    const t = e.target;
    if (t.closest && t.closest('.icon-btn, .chip, #close, #settings-menu, input, label')) return;
    dragging = true;
    pywebview.api.start_drag();
  });
  window.addEventListener('mousemove', function () {
    if (dragging) pywebview.api.move_window(0, 0);
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
  });

  setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
